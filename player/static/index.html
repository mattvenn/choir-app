<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choir Practice</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/opensheetmusicdisplay@1.9.0/build/opensheetmusicdisplay.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tone@15.1.22/build/Tone.js"></script>
</head>
<body>
  <header>
    <h1><select id="song" data-i18n-aria-label="song"></select></h1>
    <div class="controls">
      <button id="play" disabled data-i18n="play"></button>
      <button id="stop" disabled data-i18n="stop"></button>
      <button id="solo" aria-pressed="false" data-i18n="solo" data-i18n-title="soloTitle"></button>
      <span id="bar"></span>
      <label class="tempo">♩ =
        <input id="tempo" type="range" min="40" max="160" step="1">
        <output id="tempo-value" for="tempo"></output>
      </label>
      <label class="check"><input id="metronome" type="checkbox"> <span data-i18n="metronome"></span></label>
      <input id="click-volume" type="range" min="0" max="100" value="25"
             data-i18n-aria-label="clickVolume" data-i18n-title="clickVolume">
      <span id="status" data-i18n="loading"></span>
    </div>
    <table class="parts">
      <thead><tr id="part-names"><th></th></tr></thead>
      <tbody>
        <tr id="show-row"><th scope="row" data-i18n="show"></th></tr>
        <tr id="hear-row"><th scope="row" data-i18n="hear"></th></tr>
      </tbody>
    </table>
    <p class="hint" data-i18n="hint"></p>
  </header>
  <main>
    <div id="score-wrap">
      <!-- outside #score: OSMD empties its container when it loads a song -->
      <div id="highlight" hidden></div>
      <div id="score"></div>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
