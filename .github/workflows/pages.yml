# Publish the player (player/static) to GitHub Pages on every push to main.
# The built scores are committed; this checks they match the sources first.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r player/requirements.txt
      - name: Check the committed scores are up to date
        run: |
          python player/prepare.py
          if [ -n "$(git status --porcelain player/static/scores)" ]; then
            git status --short player/static/scores
            echo "::error::Scores are out of date: run player/prepare.py and commit the result"
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: player/static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
